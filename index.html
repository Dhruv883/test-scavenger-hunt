<!DOCTYPE html>
<html>
<head>
  <title>Wrong Clue</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      margin: 0;
    }

    .box {
      padding: 40px;
      border: 2px solid #444;
      border-radius: 20px;
      background: #1c1c1c;
      max-width: 500px;
    }

    h1 {
      font-size: 3rem;
      color: #ff4d4d;
    }

    p {
      font-size: 1.3rem;
      margin-top: 15px;
      color: #ddd;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Oops 😈</h1>
    <p>You scanned the wrong clue.</p>
    <p>Better luck, detectives.</p>
  </div>
</body>
</html>
